<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>集群快照管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <header class="titlebar pywebview-drag-region">
    <div class="tb-left">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name" data-i18n="app.name">快照管理器</span>
      </div>
    </div>
    <div class="tb-center">
      <span class="tb-status clickable" id="vmwareStatus" title="VMware 环境状态（点击查看）">
        <span class="dot" id="vmwareDot"></span>
        <span id="vmwareStatusText">VMware 检查中…</span>
      </span>
    </div>
    <div class="tb-right">
      <button class="tb-icon" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2L17 7M7 17l-1.8 1.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="win-btns">
        <button class="win-btn" id="minBtn" title="最小化"><svg viewBox="0 0 10 10" width="11" height="11"><rect x="1" y="4.7" width="8" height="0.6" fill="currentColor"/></svg></button>
        <button class="win-btn" id="maxBtn" title="最大化"><svg viewBox="0 0 10 10" width="11" height="11"><rect x="1.3" y="1.3" width="7.4" height="7.4" rx="1" stroke="currentColor" stroke-width="0.8" fill="none"/></svg></button>
        <button class="win-btn win-close" id="closeBtn" title="关闭"><svg viewBox="0 0 10 10" width="11" height="11"><path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>

  <main class="content">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview" data-i18n="tab.overview">概览</button>
      <button class="tab" data-tab="cluster" data-i18n="tab.cluster">集群</button>
      <button class="tab" data-tab="ops" data-i18n="tab.ops">快照操作</button>
      <button class="tab" data-tab="runtime" data-i18n="tab.runtime">运行状态</button>
      <button class="tab" data-tab="settings" data-i18n="tab.settings">设置</button>
    </nav>

    <div class="page" id="page-overview">
      <div class="sec-head"><span class="sec-title" data-i18n="ov.title">快照分布</span>
        <button class="mini-btn" id="refreshOverview" style="margin-left:auto" data-i18n="btn.refresh">刷新</button>
        <button class="mini-btn" id="rescanVms" data-i18n="btn.rescan">重新扫描</button>
      </div>
      <div id="vmList"></div>
      <div class="hint-foot" data-i18n="ov.hint">虚拟机由软件自动扫描（读取 VMware 记录）。路径不对或没扫到？可在「设置」中配置。</div>
    </div>

    <div class="page hidden" id="page-cluster">
      <div id="vmwareCard"></div>

      <div id="clusterCard"></div>

      <div class="sec-head"><span class="sec-title" data-i18n="cl.nodes">集群节点</span>
        <button class="mini-btn" id="clusterAdd" style="margin-left:auto" data-i18n="cl.add">添加节点</button>
        <button class="mini-btn primary" id="clusterCheck" data-i18n="cl.check">一键体检</button>
      </div>
      <div id="nodeList"></div>
      <div class="hint-foot" data-i18n="cl.hint">节点用于 SSH 连接集群（健康检查、启停等）。密码仅存本机，不上传。</div>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="cl.power">集群启停</span>
        <button class="mini-btn primary" id="clusterStart" style="margin-left:auto" data-i18n="cl.startAll">一键启动</button>
        <button class="mini-btn" id="clusterStop" data-i18n="cl.stopAll">一键停止</button>
        <button class="mini-btn" id="vmShutdown" data-i18n="cl.shutdownVms">关闭所有虚拟机</button>
      </div>
      <div id="powerProgress"></div>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="cl.detail">节点详情</span></div>
      <div id="nodeDetail"><div class="empty" data-i18n="cl.pick">点击上方节点查看详情</div></div>
    </div>

    <div class="page hidden" id="page-ops">
      <div class="sec-head"><span class="sec-title" data-i18n="ops.snapTitle">打快照</span></div>
      <div class="form-row">
        <input id="snapName" data-i18n-ph="ph.snapName" placeholder="快照名（如 base_clean_1010）">
        <div class="dd">
          <div class="dd-btn" id="snapDDBtn"><span id="snapDDLabel" data-i18n="dd.select">选择虚拟机</span><span class="arrow">▼</span></div>
          <div class="dd-menu" id="snapDDMenu"></div>
        </div>
        <button class="primary" id="doSnap" data-i18n="btn.create">创建</button>
      </div>
      <div class="result" id="snapResult"></div>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="ops.revTitle">切换分支</span></div>
      <div class="form-row">
        <select id="revName"><option value="" data-i18n="dd.selectBranch">选择分支…</option></select>
        <div class="dd">
          <div class="dd-btn" id="revDDBtn"><span id="revDDLabel" data-i18n="dd.select">选择虚拟机</span><span class="arrow">▼</span></div>
          <div class="dd-menu" id="revDDMenu"></div>
        </div>
        <button class="primary" id="doRev" data-i18n="btn.revert">回滚</button>
      </div>
      <div class="result" id="revResult"></div>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="ops.delTitle">删除快照</span></div>
      <div class="form-row">
        <select id="delVm"></select>
        <select id="delSnap"></select>
        <button id="doDel" disabled data-i18n="btn.delete">删除</button>
      </div>
      <div class="result" id="delResult"></div>
    </div>

    <div class="page hidden" id="page-runtime">
      <div class="sec-head"><span class="sec-title" data-i18n="run.title">运行中的虚拟机</span>
        <button class="mini-btn" id="refreshRun" style="margin-left:auto" data-i18n="btn.refresh">刷新</button>
      </div>
      <div id="runList"></div>
      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="run.startStop">启动 / 停止</span></div>
      <div class="form-row">
        <select id="opVm"></select>
        <button class="primary" id="doStart" data-i18n="btn.start">启动</button>
        <button id="doStop" data-i18n="btn.stop">停止</button>
      </div>
      <div class="result" id="opResult"></div>
    </div>

    <div class="page hidden" id="page-settings">
      <div class="sec-head"><span class="sec-title" data-i18n="set.general">通用</span></div>
      <div class="form-row">
        <span class="sec-note-inline" data-i18n="set.language">语言</span>
        <select id="langSelect" style="max-width:200px">
          <option value="zh">简体中文</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="form-row" style="margin-top:0.8rem">
        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer">
          <input type="checkbox" id="autoCheck" style="width:auto;min-width:0">
          <span data-i18n="set.autoCheck">打开集群页时自动体检</span>
        </label>
      </div>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="set.vmware">VMware 路径</span></div>
      <div class="form-row">
        <input id="vmrunPath" data-i18n-ph="ph.vmrun" placeholder="vmrun.exe 路径">
        <button class="primary" id="saveVmrun" data-i18n="btn.save">保存</button>
      </div>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="set.vmNames">虚拟机名称</span>
        <span class="sec-note-inline" data-i18n="set.vmNamesNote">显示名（大字）与备注（灰色小字）</span>
      </div>
      <div id="aliasList"></div>
      <button class="primary" id="saveAllAlias" style="margin-top:1rem" data-i18n="btn.saveAll">保存全部</button>

      <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="set.about">关于</span></div>
      <div class="card" id="aboutCard">
        <div class="card-top">
          <div>
            <span class="vm-name" data-i18n="app.name">集群快照管理器</span>
            <span class="vm-role" id="aboutVer">v0.2.0</span>
          </div>
          <button class="mini-btn" id="checkUpdateBtn" data-i18n="btn.checkUpdate">检查更新</button>
        </div>
        <div class="empty" id="aboutAuthor"></div>
        <div class="empty" id="updateMsg"></div>
      </div>
    </div>
  </main>

  <!-- 自绘对话框 -->
  <div class="modal-mask hidden" id="modalMask">
    <div class="modal">
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot">
        <button class="primary" id="modalOk">确定</button>
        <button id="modalCancel">取消</button>
      </div>
    </div>
  </div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
