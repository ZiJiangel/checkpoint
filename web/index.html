<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>集群快照管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <header class="titlebar pywebview-drag-region">
    <div class="tb-left">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name" data-i18n="app.name">快照管理器</span>
      </div>
    </div>
    <div class="tb-center">
      <span class="tb-status clickable" id="vmwareStatus" title="VMware 环境状态（点击查看）">
        <span class="dot" id="vmwareDot"></span>
        <span id="vmwareStatusText">VMware 检查中…</span>
      </span>
    </div>
    <div class="tb-right">
      <button class="tb-icon" id="themeBtn" title="切换主题">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2L17 7M7 17l-1.8 1.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="win-btns">
        <button class="win-btn" id="minBtn" title="最小化"><svg viewBox="0 0 10 10" width="11" height="11"><rect x="1" y="4.7" width="8" height="0.6" fill="currentColor"/></svg></button>
        <button class="win-btn" id="maxBtn" title="最大化"><svg viewBox="0 0 10 10" width="11" height="11"><rect x="1.3" y="1.3" width="7.4" height="7.4" rx="1" stroke="currentColor" stroke-width="0.8" fill="none"/></svg></button>
        <button class="win-btn win-close" id="closeBtn" title="关闭"><svg viewBox="0 0 10 10" width="11" height="11"><path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>

  <main class="content">
    <aside class="sidebar" id="sidebar">
      <div class="side-scroll">
        <div class="side-block">
          <div class="side-title">
            <span data-i18n="cl.clusterSel">集群</span>
            <button class="side-add" id="clusterTpl" title="从模板创建">⊞</button>
            <button class="side-add" id="clusterNew" title="新建集群">＋</button>
          </div>
          <div id="clusterNav" class="side-list"></div>
        </div>
        <div class="side-block">
          <div class="side-title">
            <span data-i18n="tab.vm">虚拟机</span>
            <button class="side-add" id="rescanVms" title="重新扫描">↻</button>
          </div>
          <div id="vmNav" class="side-list"></div>
        </div>
      </div>
      <div class="side-footer">
        <div class="nav-item" id="navSettings" data-i18n="tab.settings">设置</div>
      </div>
    </aside>

    <section class="main" id="mainArea">
      <div class="view" id="view-cluster">
        <div class="toolbar">
          <span class="bar-title" id="clusterTitle">集群</span>
          <span class="bar-spacer"></span>
          <button class="mini-btn" id="clusterAdd" data-i18n="cl.add" data-i18n-title="tip.add">添加节点</button>
          <button class="mini-btn" id="clusterCheck" data-i18n="cl.check" data-i18n-title="tip.check">体检</button>
          <button class="mini-btn" id="deployCheck" data-i18n="cl.deployCheck" data-i18n-title="tip.deploy">部署自检</button>
          <button class="mini-btn primary" id="clusterStart" data-i18n="cl.startAll" data-i18n-title="tip.start">一键启动</button>
          <button class="mini-btn" id="clusterStop" data-i18n="cl.stopAll" data-i18n-title="tip.stop">一键停止</button>
          <button class="mini-btn" id="vmShutdown" data-i18n="cl.shutdownVms" data-i18n-title="tip.shutdown">关闭虚拟机</button>
        </div>
        <div id="vmwareCard"></div>
        <div id="clusterCard"></div>
        <div id="clusterOverview"></div>
        <div id="nodeList"></div>
        <div id="powerProgress"></div>

        <div class="sec-head" style="margin-top:1.4rem"><span class="sec-title" data-i18n="cl.clusterSnap">集群快照</span>
          <span class="sec-note-inline" data-i18n="cl.clusterSnapHint">给整个集群的节点一次性打快照 / 回滚</span>
        </div>
        <div class="form-row">
          <input id="clusterSnapName" data-i18n-ph="ph.snapName" placeholder="快照名（如 base_clean_1010）" style="max-width:260px">
          <button class="primary" id="clusterSnapCreate" data-i18n="cl.snapSelected">给选中节点打快照</button>
          <span class="svc-action" id="snapSelectAll" data-i18n="cl.selectAll">全选</span>
          <span class="svc-action" id="snapSelectNone" data-i18n="cl.selectNone">全不选</span>
        </div>
        <div id="snapNodePick" class="snap-pick"></div>
        <div class="result" id="clusterSnapResult"></div>
        <div id="clusterSnapList"></div>

        <div class="sec-head" style="margin-top:1.4rem"><span class="sec-title" data-i18n="cl.distTitle">配置分发</span>
          <span class="sec-note-inline" data-i18n="cl.distHint">把 master 上的配置目录同步到从节点（需 SSH 免密）</span>
        </div>
        <div class="form-row">
          <input id="distSrc" value="/root/app/hadoop/etc/hadoop" placeholder="源目录（master）" style="max-width:320px">
          <input id="distDst" value="/root/app/hadoop/etc/hadoop" placeholder="目标目录（从节点）" style="max-width:320px">
          <button class="primary" id="distGo" data-i18n="cl.distGo">分发到从节点</button>
        </div>
        <div class="result" id="distResult"></div>
      </div>

      <div class="view hidden" id="view-node">
        <div class="view-head"><span class="crumb" id="nodeBack">‹ 集群</span></div>
        <div id="nodeDetail"></div>
      </div>

      <div class="view hidden" id="view-vm">
        <div class="view-head"><span class="crumb" id="vmBack">‹ 集群</span></div>
        <div id="vmDetail"></div>
      </div>

      <div class="view hidden" id="view-settings">
        <div class="view-head"><span class="bar-title" data-i18n="tab.settings">设置</span></div>
        <div class="sec-head"><span class="sec-title" data-i18n="set.general">通用</span></div>
        <div class="form-row">
          <span class="sec-note-inline" data-i18n="set.language">语言</span>
          <select id="langSelect" style="max-width:200px">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-row" style="margin-top:0.8rem">
          <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer">
            <input type="checkbox" id="autoCheck" style="width:auto;min-width:0">
            <span data-i18n="set.autoCheck">打开集群页时自动体检</span>
          </label>
        </div>
        <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="set.vmware">VMware 路径</span></div>
        <div class="form-row">
          <input id="vmrunPath" data-i18n-ph="ph.vmrun" placeholder="vmrun.exe 路径">
          <button class="primary" id="saveVmrun" data-i18n="btn.save">保存</button>
        </div>
        <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="set.vmNames">虚拟机名称</span>
          <span class="sec-note-inline" data-i18n="set.vmNamesNote">显示名（大字）与备注（灰色小字）</span>
        </div>
        <div id="aliasList"></div>
        <button class="primary" id="saveAllAlias" style="margin-top:1rem" data-i18n="btn.saveAll">保存全部</button>
        <div class="sec-head" style="margin-top:2rem"><span class="sec-title" data-i18n="set.about">关于</span></div>
        <div class="card" id="aboutCard">
          <div class="card-top">
            <div>
              <span class="vm-name" data-i18n="app.name">集群快照管理器</span>
              <span class="vm-role" id="aboutVer">v0.6.0</span>
            </div>
            <button class="mini-btn" id="checkUpdateBtn" data-i18n="btn.checkUpdate">检查更新</button>
          </div>
          <div class="empty" id="aboutAuthor"></div>
          <div class="empty" id="updateMsg"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-mask hidden" id="modalMask">
    <div class="modal">
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot">
        <button class="primary" id="modalOk">确定</button>
        <button id="modalCancel">取消</button>
      </div>
    </div>
  </div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
